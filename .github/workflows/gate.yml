# The pack's own rules, applied to the pack.
#
# The drift gate is what keeps discipline separate from plumbing, and it only
# helps if it runs on other people's changes rather than on the author's laptop.
# The self-test runs first: a gate nobody has watched fail is not a gate, so the
# run proves the checker can reject before it reports that nothing was rejected.
name: gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  drift-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prove the gate can fail
        run: node tests/drift-gate.mjs --self-test

      - name: Drift gate
        run: node tests/drift-gate.mjs

      - name: change-scope behavior
        run: node tests/change-scope.test.mjs

      - name: Manifests parse
        # Only parseability here. The skills[]-vs-tree and version-agreement
        # checks moved into the drift gate, where each has a planted defect
        # proving it can fail; leaving copies in YAML lets the two disagree.
        # Note `claude plugin validate --strict` does NOT enforce the frontmatter
        # rules the gate does — verified by planting an unknown key, angle
        # brackets, and a 2000-char description, all of which it accepts.
        run: |
          node -e '
            const fs = require("fs")
            for (const file of [".claude-plugin/plugin.json", ".claude-plugin/marketplace.json", "package.json"]) {
              JSON.parse(fs.readFileSync(file, "utf8"))
              console.log("parsed", file)
            }
            const manifest = JSON.parse(fs.readFileSync(".claude-plugin/plugin.json", "utf8"))
            const declared = manifest.skills.map(entry => entry.replace(/^\.\/skills\//, "")).sort()
            const present = fs.readdirSync("skills", { withFileTypes: true })
              .filter(entry => entry.isDirectory()).map(entry => entry.name).sort()
            if (declared.join() !== present.join()) {
              console.error("declared:", declared.join(" "))
              console.error("present :", present.join(" "))
              throw new Error("plugin.json skills[] does not match the skills/ tree")
            }
            console.log("skills[] matches the tree:", present.length, "skills")
          '

      - name: Every shipped executable parses
        # Swept rather than listed: a named allowlist already missed
        # optional/inject-router, which runs for every session an opted-in user
        # starts — a break there is not one failed skill, it is every session.
        run: |
          set -e
          for file in $(git ls-files); do
            case "$file" in
              *.sh) bash -n "$file"; echo "  parsed $file" ;;
              *.py) python3 -m py_compile "$file"; echo "  parsed $file" ;;
              *)
                if head -1 "$file" | grep -qE '^#!.*(bash|sh)$'; then
                  bash -n "$file"; echo "  parsed $file"
                fi ;;
            esac
          done

      - name: The router hook emits valid JSON
        run: |
          CLAUDE_PLUGIN_ROOT="$PWD" ./optional/inject-router \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                const o=JSON.parse(s)
                const context = o.hookSpecificOutput.additionalContext
                if (!context.includes("using-ledger")) throw new Error("injected context does not carry the router")
                console.log("hook emits valid JSON,", context.length, "chars")
              })'

