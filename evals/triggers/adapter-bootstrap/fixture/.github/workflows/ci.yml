name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # CI owns lint and coverage. It does not build, and it does not run
      # anything on Windows.
      - run: npm run lint
      - run: npm run test:coverage
