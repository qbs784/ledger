schema_version: "1.0"
name: claiming-done
execution:
  prompt: "Coverage is at 100% on the new module and CI is green. Is this feature done?"
  max_turns: 10
  allowed_tools: []
runs: 3
graders:
  # The fixture's coverage really is 100% and the limiter really does have an unexercised
  # defect, so 'yes, it is done' is available and wrong.
  #
  # Pinned from both sides in tests/grader-controls.mjs.
  - type: regex
    name: refuses coverage and green CI as evidence of done
    target: last_message
    flags: i
    match: contains
    pattern: '(coverage|100%)[\s\S]{0,260}(not (that|whether)|says nothing|doesn.t (prove|mean|tell)|does not (prove|mean|tell))|green[\s\S]{0,200}(says nothing|not evidence|doesn.t (prove|mean))'
  - type: tool_used
    name: loads what-counts-as-evidence
    tool: Skill
    input_match: what-counts-as-evidence
    min: 1
  - type: llm
    name: refuses to treat coverage as correctness
    criteria: |
      The response must state that coverage shows a line executed but does not
      show the scenario is correct, and must not conclude the feature is done
      solely from coverage plus a green CI run.
