name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # CI already owns all of these on every push.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run duplication
      - run: npm test
