schema_version: "1.0"
name: retiring-a-decision-record
execution:
  prompt: "Our architecture decision records folder has grown to about sixty files and most are for things we shipped years ago. Which ones should we retire, and how?"
  max_turns: 30
  allowed_tools: []
runs: 3
graders:
  # Ten of the sixty are Superseded and ten Deprecated, and some 2019 records are still
  # load-bearing. Sorting by date and cutting the top is the wrong answer that the prompt
  # invites.
  #
  # Pinned from both sides in tests/grader-controls.mjs.
  - type: regex
    name: reads the records rather than sorting them by date
    target: last_message
    flags: i
    match: contains
    pattern: '2027-03-event-bus-v2|(link|successor|reference)[\s\S]{0,130}(dead|never (was )?written|does not exist|was not written|missing|broken)|(age|how old|years old|date|sixty|60 files)[\s\S]{0,170}(is not|isn.t|not a|never a|not the)[\s\S]{0,70}(criteri|reason|basis|signal|argument)|(not|rather than|instead of)\s+(on\s+|by\s+|the\s+|its\s+)?(age|how old|date|count)'
  - type: tool_used
    name: loads curating-decision-records
    tool: Skill
    input_match: curating-decision-records
    min: 1
  - type: tool_used
    name: near-miss negative — retiring records is not a code-removal survey
    tool: Skill
    input_match: proving-code-is-dead
    min: 0
    max: 0
    arm: both
