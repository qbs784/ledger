schema_version: "1.0"
name: shorten-a-readme
execution:
  prompt: "Our package README has grown to nine hundred lines and repeats itself in three places. Cut it down."
  max_turns: 10
  allowed_tools: []
runs: 3
graders:
  # The API and the options are each presented three times over 900 lines. Deleting filler
  # shortens the file without fixing the reason it grew.
  #
  # Pinned from both sides in tests/grader-controls.mjs.
  - type: regex
    name: identifies the repeated presentation rather than only cutting length
    target: last_message
    flags: i
    match: contains
    pattern: '(options?|methods?|api)[\s\S]{0,140}(table|list|section)[\s\S]{0,140}(three|twice|3|repeat|duplicat)|(repeat|duplicat)[a-z]*[\s\S]{0,160}(options?|methods?|api)|one home|single (home|place|source)'
  - type: tool_used
    name: loads writing-complete-propositions
    tool: Skill
    input_match: writing-complete-propositions
    min: 1
  - type: tool_used
    name: near-miss negative — plain shortening is not a session-vantage sweep
    tool: Skill
    input_match: trimming-session-vantage
    min: 0
    max: 0
    arm: both
